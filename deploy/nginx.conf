server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # index.html 이 없으므로 디렉터리 목록을 보여준다.
    autoindex on;
    charset utf-8;
    default_type text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
